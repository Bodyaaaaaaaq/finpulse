[program:finpulse]
directory=/opt/finpulse/server
command=/opt/finpulse/server/.venv/bin/gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 127.0.0.1:8000
user=finpulse
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stdout_logfile=/var/log/finpulse/out.log
stderr_logfile=/var/log/finpulse/err.log
environment=PYTHONUNBUFFERED="1"